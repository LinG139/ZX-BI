spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  session:
    timeout: 2592000
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/liubi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 345678

  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  #    password: 345678
  rabbitmq:
    host: localhost
    port: 5672
    password: guest
    username: guest
    enabled: true
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
      max-request-size: 10MB

# 文件存储配置
file:
  upload:
    path: upload/
  access:
    url: http://localhost:9001/api/file/avatar/

server:
  port: 9001
  address: 0.0.0.0
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 日志配置
logging:
  level:
    root: INFO
    com.panther.smartBI: DEBUG
    com.panther.smartBI.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value:  0
  mapper-locations: classpath*:mapper/*.xml

# AI配置
ai:
  provider: zhipu

# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx